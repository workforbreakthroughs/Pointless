    <title>Pointless: The Great Pencil Escape</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(rgba(148, 163, 184, 0.25) 1.5px, transparent 1.5px),
                radial-gradient(circle at 50% 0%, rgba(219, 234, 254, 0.6) 0%, rgba(241, 245, 249, 0) 70%);
            background-size: 24px 24px, 100% 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .font-heading {
            font-family: 'Fredoka One', cursive;
        }
        
        /* iOS Liquid Glass UI Styles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 20px 40px -15px rgba(15, 23, 42, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.5),
                inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.95);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px) saturate(190%);
            -webkit-backdrop-filter: blur(16px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 
                0 10px 30px -5px rgba(0, 0, 0, 0.04),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.9);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 
                0 4px 12px rgba(15, 23, 42, 0.05),
                inset 0 1px 0.5px rgba(255, 255, 255, 0.95);
        }

        .glass-pill-dark {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 24px rgba(15, 23, 42, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        .glass-button {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.85) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 4px 14px rgba(15, 23, 42, 0.06),
                inset 0 1.5px 1px rgba(255, 255, 255, 1);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-button:active {
            transform: scale(0.96);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }
        
        /* Animation Juice */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 0s 2;
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }

        @keyframes sharpenDown {
            0% { transform: translateY(-15px) rotate(-2deg); }
            50% { transform: translateY(10px) rotate(2deg); }
            100% { transform: translateY(-15px) rotate(-2deg); }
        }
        .animate-sharpen-down {
            animation: sharpenDown 1s ease-in-out infinite;
        }

        .btn-press {
            transition: transform 0.1s;
        }
        .btn-press:active {
            transform: scale(0.92);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="overflow-x-hidden selection:bg-yellow-200">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
