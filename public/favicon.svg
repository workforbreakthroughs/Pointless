<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="eraser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="ferrule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Diagonal Pencil -->
  <g filter="url(#shadow)">
    <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
      <!-- Eraser -->
      <path d="M 216 60 L 296 60 C 310 60 320 70 320 85 L 320 120 L 192 120 L 192 85 C 192 70 202 60 216 60 Z" fill="url(#eraser)" />
      
      <!-- Ferrule (metal collar) -->
      <rect x="192" y="120" width="128" height="36" fill="url(#ferrule)" />
      <line x1="192" y1="138" x2="320" y2="138" stroke="#64748b" stroke-width="4" opacity="0.6" />

      <!-- Pencil Shaft -->
      <rect x="192" y="156" width="128" height="200" fill="url(#pencilBody)" />
      <!-- Facet lines -->
      <line x1="235" y1="156" x2="235" y2="356" stroke="#fef08a" stroke-width="6" opacity="0.5" />
      <line x1="277" y1="156" x2="277" y2="356" stroke="#b45309" stroke-width="6" opacity="0.4" />

      <!-- Cute Face on pencil body -->
      <!-- Eyes -->
      <circle cx="232" cy="230" r="10" fill="#0f172a" />
      <circle cx="280" cy="230" r="10" fill="#0f172a" />
      <circle cx="235" cy="227" r="3.5" fill="#ffffff" />
      <circle cx="283" cy="227" r="3.5" fill="#ffffff" />
      <!-- Smile -->
      <path d="M 242 250 Q 256 264 270 250" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />

      <!-- Wooden Sharpened Tip -->
      <polygon points="192,356 320,356 256,440" fill="#fde68a" />
      
      <!-- Graphite Lead Tip -->
      <polygon points="238,396 274,396 256,440" fill="#1e293b" />
    </g>
  </g>
</svg>
